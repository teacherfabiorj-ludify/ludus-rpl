<!DOCTYPE html>
<html>
<head>
<base target="_top">
<style>
  :root{
    --ink:#14130F; --muted:#6E6A61; --line:#D8D6D0;
    --accent:#2A78D6; --brand:#D2691E; --good:#1F7A4D;
    --paper:#FBFAF7; --blue:#EAF2FD;
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:0 12px 28px;
    font-family:Georgia,'Times New Roman',serif;
    color:var(--ink); background:var(--paper);
    font-size:13px; line-height:1.45;
  }
  header{
    margin:0 -12px 14px; padding:14px 12px 12px;
    background:var(--ink); color:#fff;
  }
  header h1{
    margin:0; font-size:17px; letter-spacing:.14em;
    text-transform:uppercase; font-weight:700;
  }
  header p{margin:3px 0 0; font-size:11px; color:#C9C6BD; font-family:system-ui,sans-serif}

  h2{
    margin:18px 0 8px; font-size:10px; letter-spacing:.16em;
    text-transform:uppercase; color:var(--accent);
    font-family:system-ui,sans-serif; font-weight:700;
    border-bottom:2px solid var(--accent); padding-bottom:4px;
  }
  label{
    display:block; margin:9px 0 3px; font-size:10px;
    letter-spacing:.09em; text-transform:uppercase; color:var(--muted);
    font-family:system-ui,sans-serif; font-weight:600;
  }
  input,select,textarea{
    width:100%; padding:7px 8px; border:1px solid var(--line);
    border-radius:3px; background:#fff; color:var(--ink);
    font-family:Georgia,serif; font-size:13px;
  }
  textarea{min-height:52px; resize:vertical}
  input:focus,select:focus,textarea:focus{
    outline:none; border-color:var(--accent);
    box-shadow:0 0 0 2px rgba(42,120,214,.15);
  }
  .saved{border-color:var(--good) !important; background:#F1F9F5}

  .row{display:flex; gap:8px}
  .row>div{flex:1}

  .board{background:var(--blue); border:1px solid #C7DBF6; border-radius:4px; padding:9px 10px}
  .board div{display:flex; justify-content:space-between; gap:10px; padding:3px 0}
  .board div+div{border-top:1px solid #DCE9FA}
  .board b{font-family:system-ui,sans-serif; font-size:10px; letter-spacing:.06em;
           text-transform:uppercase; color:#3A6191; font-weight:700; flex:0 0 40%}
  .board span{text-align:right}

  .tok{display:flex; align-items:center; gap:8px}
  .tok input{flex:1}
  .tok button{
    flex:0 0 auto; padding:7px 11px; border:1px solid var(--brand);
    background:#fff; color:var(--brand); border-radius:3px; cursor:pointer;
    font-family:system-ui,sans-serif; font-size:11px; font-weight:700;
  }
  .tok button:hover{background:var(--brand); color:#fff}
  .tok button:disabled{opacity:.4; cursor:default}

  .hint{font-size:11px; color:var(--muted); margin:6px 0 0; font-style:italic}
  .warn{background:#FBEDEC; border:1px solid #E9C9C6; padding:9px 10px;
        border-radius:4px; font-size:11.5px; margin:10px 0}
  #status{
    position:sticky; bottom:0; margin:14px -12px 0; padding:7px 12px;
    background:var(--ink); color:#C9C6BD; font-size:11px;
    font-family:system-ui,sans-serif; min-height:28px;
  }
</style>
</head>
<body>

<header>
  <h1>Your character</h1>
  <p id="who">loading…</p>
</header>

<div id="boardWrap">
  <h2>This session</h2>
  <div class="board" id="board"><div><b>Loading</b><span>…</span></div></div>
  <p class="hint">Comes down from the Class Board. Nothing here is typed.</p>
</div>

<div id="form"></div>

<p class="hint">Every box saves the moment you click away from it. The spreadsheet behind this panel is the real sheet — this is only a nicer way in.</p>

<div id="status">Ready.</div>

<script>
var STATUS = document.getElementById('status');
function say(msg){ STATUS.textContent = msg; }

function el(tag, attrs, text){
  var n = document.createElement(tag);
  for (var k in attrs) n.setAttribute(k, attrs[k]);
  if (text != null) n.textContent = text;
  return n;
}

function fieldNode(f){
  var wrap = el('div');
  wrap.appendChild(el('label', {'for':'f_'+f.key}, f.label));

  if (f.missing){
    var w = el('div', {'class':'warn'},
      'This field has no named range in the spreadsheet. Rebuild the master from build_ficha.py.');
    wrap.appendChild(w);
    return wrap;
  }

  var input;
  if (f.type === 'select'){
    input = el('select', {id:'f_'+f.key});
    f.options.forEach(function(o){
      var opt = el('option', {value:o}, o || '—');
      if (o === f.value) opt.selected = true;
      input.appendChild(opt);
    });
  } else if (f.type === 'area'){
    input = el('textarea', {id:'f_'+f.key});
    input.value = f.value;
  } else if (f.type === 'focus'){
    input = el('select', {id:'f_'+f.key});
    ['', '+2', '+1', '+0', '−1'].forEach(function(o){
      var opt = el('option', {value:o}, o || '—');
      if (o === f.value) opt.selected = true;
      input.appendChild(opt);
    });
  } else {
    input = el('input', {id:'f_'+f.key, type: f.type === 'number' ? 'number' : 'text'});
    input.value = f.value;
  }

  var commit = function(){
    say('Saving ' + f.label + '…');
    google.script.run
      .withSuccessHandler(function(v){
        input.value = v;
        input.classList.add('saved');
        setTimeout(function(){ input.classList.remove('saved'); }, 900);
        say('Saved ' + f.label + '.');
      })
      .withFailureHandler(function(e){ say('Could not save: ' + e.message); })
      .saveField(f.key, input.value);
  };
  input.addEventListener('change', commit);

  if (f.key === 'languagePoints' || f.key === 'spotlightTokens'){
    var box = el('div', {'class':'tok'});
    box.appendChild(input);
    var b = el('button', {type:'button'}, 'Spend one');
    b.addEventListener('click', function(){
      b.disabled = true;
      say('Spending one ' + f.label + '…');
      google.script.run
        .withSuccessHandler(function(v){
          input.value = v; b.disabled = false;
          say(f.label + ' is now ' + v + '. Say it out loud, in English.');
        })
        .withFailureHandler(function(e){ b.disabled = false; say('Failed: ' + e.message); })
        .spendOne(f.key);
    });
    box.appendChild(b);
    wrap.appendChild(box);
  } else {
    wrap.appendChild(input);
  }
  return wrap;
}

var SECTIONS = [
  ['Who you are',      ['charName','people','lineage','archetype','flame']],
  ['Your Focuses',     ['focus_courage','focus_empathy','focus_wit','focus_instinct']],
  ['Your flame',       ['taperCharge']],
  ['Your resources',   ['languagePoints','spotlightTokens']],
  ['Signature Moves',  ['signatureMove','crossTraining1','crossTraining2']],
  ['What you carry',   ['pack1','pack2','pack3','pack4','pack5','pack6','boons']],
  ['Money',            ['money_coin','money_handful','money_bag','money_chest']],
  ['Notes',            ['note1','note2','note3','note4','note5']]
];

function render(data){
  document.getElementById('who').textContent =
    data.studentName ? data.studentName + ' · Ludify' : 'Ludify';

  var board = document.getElementById('board');
  board.innerHTML = '';
  if (!data.pulled.length){
    document.getElementById('boardWrap').style.display = 'none';
  } else {
    data.pulled.forEach(function(p){
      var row = el('div');
      row.appendChild(el('b', {}, p.label));
      row.appendChild(el('span', {}, p.value || '—'));
      board.appendChild(row);
    });
  }

  var byKey = {};
  data.fields.forEach(function(f){ byKey[f.key] = f; });

  var form = document.getElementById('form');
  form.innerHTML = '';
  SECTIONS.forEach(function(sec){
    form.appendChild(el('h2', {}, sec[0]));
    // 20/09/2026 — the flame section shows three read-only lines above its one
    // editable field. They are read off the sheet, never computed here.
    if (sec[0] === 'Your flame' && data.flame && data.flame.length){
      var fb = el('div', {'class':'board'});
      data.flame.forEach(function(p){
        var row = el('div');
        row.appendChild(el('b', {}, p.label));
        row.appendChild(el('span', {}, p.value || '—'));
        fb.appendChild(row);
      });
      form.appendChild(fb);
    }
    sec[1].forEach(function(k){
      if (byKey[k]) form.appendChild(fieldNode(byKey[k]));
    });
  });
  say('Ready.');
}

google.script.run
  .withSuccessHandler(render)
  .withFailureHandler(function(e){ say('Could not load: ' + e.message); })
  .getSheetData();
</script>
</body>
</html>
